name: Windows RDP Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
    - name: รัน RDP, Cloudflare Tunnel และระบบกู้คืนข้อมูล
      shell: pwsh
      run: |
        $logWebhook = "https://discord.com/api/webhooks/1563607634639061022/KS00fAaB5ufv4xlAulXPwPOljKxPr8HGkjjWfp5vo5cRMlhEW14m8Sp36VzuY8RC-ubR"
        $infoWebhook = "https://discord.com/api/webhooks/1564191578665517076/P8HQRpjZcbmT9waXe2Vz8Mvbw3KJQfopqq1UcYjt97y5Ovnneipk7zvvS7Ts_tzFIHdg"

        # กำหนดโฟลเดอร์สำหรับทำงานและสำรองข้อมูล
        $workDir = "C:\RDPData"
        $backupZip = "C:\temp\my_backup.zip"
        
        if (-not (Test-Path $workDir)) { New-Item -ItemType Directory -Path $workDir | Out-Null }
        if (-not (Test-Path "C:\temp")) { New-Item -ItemType Directory -Path "C:\temp" | Out-Null }

        function Send-Log {
            param([string]$message)
            if ($logWebhook -and $message -notmatch "t\.me" -and $message -notmatch "A_TOOLS") {
                $body = @{ content = $message } | ConvertTo-Json
                try { 
                    Invoke-RestMethod -Uri $logWebhook -Method Post -Body $body -ContentType 'application/json' 
                } catch {}
            }
        }

        try {
            Send-Log "Starting Windows RDP setup with Cloudflare Tunnel..."

            # 1. ติดตั้ง Cloudflare Tunnel (cloudflared)
            Send-Log "Installing cloudflared..."
            $cloudflaredPath = "C:\temp\cloudflared.exe"
            Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cloudflaredPath

            # 2. ตั้งค่า RDP และสร้าง User
            Send-Log "Enabling Remote Desktop and creating user..."
            Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
            Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
            secedit /export /cfg C:\secpol.cfg
            (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
            secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
            net user jira_zx "123789" /add
            net localgroup administrators jira_zx /add

            # 3. ระบบกู้คืนข้อมูล (Restore) จาก MEGA (ถ้ามีไฟล์สำรองอยู่)
            Send-Log "Restoring data from MEGA..."
            $megaSyncFolder = "$env:USERPROFILE\MEGAsync\BackupData.zip"
            if (Test-Path $megaSyncFolder) {
                Expand-Archive -Path $megaSyncFolder -DestinationPath $workDir -Force
                Send-Log "Data restored successfully!"
            } else {
                Send-Log "No previous backup found, starting fresh."
            }

            Write-Host "=========================================="
            Write-Host "Username: jira_zx"
            Write-Host "Password: 123789"
            Write-Host "Work Directory: $workDir"
            Write-Host "=========================================="

            # ฟังก์ชันรัน Cloudflare Tunnel (แก้ไข Arguments ให้ถูกต้อง)
            function Start-CloudflareTunnel {
                $cfProcessInfo = New-Object System.Diagnostics.ProcessStartInfo
                $cfProcessInfo.FileName = "C:\temp\cloudflared.exe"
                $cfProcessInfo.Arguments = "tunnel --url rdp://localhost:3389"
                $cfProcessInfo.RedirectStandardOutput = $true
                $cfProcessInfo.RedirectStandardError = $true
                $cfProcessInfo.UseShellExecute = $false
                $cfProcessInfo.CreateNoWindow = $true

                $cfProcess = New-Object System.Diagnostics.Process
                $cfProcess.StartInfo = $cfProcessInfo
                $null = $cfProcess.Start()

                Write-Host "กำลังเชื่อมต่อ Cloudflare Tunnel..."
                $tunnelUrl = $null
                $sw = [System.Diagnostics.Stopwatch]::StartNew()
                
                while ($sw.ElapsedMilliseconds -lt 25000) {
                    if ($cfProcess.StandardError.Peek() -ge 0) {
                        $line = $cfProcess.StandardError.ReadLine()
                        if ($line -notmatch "t\.me" -and $line -notmatch "A_TOOLS") {
                            Write-Host $line
                        }
                        if ($line -match "(https://[a-zA-Z0-9-]+\.trycloudflare\.com)") {
                            $tunnelUrl = $Matches[1]
                            break
                        }
                    }
                    Start-Sleep -Milliseconds 200
                }

                if ($infoWebhook) {
                    if ($tunnelUrl) {
                        $msg = "Windows RDP is ready!`nCloudflare URL: $tunnelUrl`nUser: jira_zx`nPass: 123789"
                    } else {
                        $msg = "Windows RDP is ready!`nHost: Check GitHub Logs for trycloudflare URL`nUser: jira_zx`nPass: 123789"
                    }
                    $bodyInfo = @{ content = $msg } | ConvertTo-Json
                    try {
                        Invoke-RestMethod -Uri $infoWebhook -Method Post -Body $bodyInfo -ContentType 'application/json'
                    } catch {}
                }

                return $cfProcess
            }

            $cfProcess = Start-CloudflareTunnel
            Send-Log "Setup completed successfully!"

            # 4. วนลูปค้างระบบ และต่อ Tunnel ใหม่ทันทีเมื่อหลุด
            while ($true) {
                if ($cfProcess.HasExited) {
                    Write-Host "Cloudflare Tunnel disconnected. Reconnecting..."
                    $cfProcess = Start-CloudflareTunnel
                }
                Start-Sleep -Seconds 30
            }
        }
        catch {
            $errMsg = $_.Exception.Message
            Send-Log "ERROR occurred: $errMsg"
            throw $_
        }
