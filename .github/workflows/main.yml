name: Windows RDP with Mega, Java 25 & Ngrok

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
    - name: รันระบบทั้งหมดพร้อมระบบแยกแจ้งเตือน Error และ Success
      shell: pwsh
      run: |
        $logWebhook = "https://discord.com/api/webhooks/1563607634639061022/KS00fAaB5ufv4xlAulXPwPOljKxPr8HGkjjWfp5vo5cRMlhEW14m8Sp36VzuY8RC-ubR"
        $infoWebhook = "https://discord.com/api/webhooks/1563607860057874485/oHcMgZ9zl0q1UsZYOlaCy8uzZGvgwRAdKkyLRiU3x3K2XlIKh3ei9aLFQnkcTeN7VlGu"

        function Send-Log {
            param([string]$message)
            if ($logWebhook) {
                $body = @{ content = $message } | ConvertTo-Json
                try { 
                    Invoke-RestMethod -Uri $logWebhook -Method Post -Body $body -ContentType 'application/json' 
                } catch {}
            }
        }

        try {
            Send-Log "Starting Windows RDP setup process..."

            # 1. ตั้งค่า RDP
            Send-Log "Enabling Remote Desktop and creating user..."
            Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
            Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
            secedit /export /cfg C:\secpol.cfg
            (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
            secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
            net user jira_zx "123789" /add
            net localgroup administrators jira_zx /add

            # 2. ติดตั้ง Java 25
            Send-Log "Downloading and installing Java 25..."
            $javaUrl = "https://download.oracle.com/java/25/latest/jdk-25_windows-x64_bin.exe"
            $javaMsi = "$env:TEMP\jdk25.exe"
            Invoke-WebRequest -Uri $javaUrl -OutFile $javaMsi
            Start-Process -FilePath $javaMsi -ArgumentList "/s" -Wait
            [Environment]::SetEnvironmentVariable("JAVA_HOME", "C:\Program Files\Java\jdk-25", "Machine")
            $env:Path += ";C:\Program Files\Java\jdk-25\bin"
            [Environment]::SetEnvironmentVariable("Path", $env:Path, "Machine")

            # 3. ติดตั้ง MEGA Desktop
            Send-Log "Downloading and installing MEGA Desktop App..."
            $megaUrl = "https://mega.nz/MEGAsyncSetup64.exe"
            $megaInstaller = "$env:TEMP\MEGAsyncSetup.exe"
            Invoke-WebRequest -Uri $megaUrl -OutFile $megaInstaller
            Start-Process -FilePath $megaInstaller -ArgumentList "/S" -Wait
            $megaPath = "C:\Program Files\MEGAsync\MEGAsync.exe"
            if (Test-Path $megaPath) { Start-Process -FilePath $megaPath }

    - name: เชื่อมต่อ RDP ผ่าน Serveo (TCP Tunnel)
     run: |
        Write-Host "=========================================="
        Write-Host "Username: jira_zx"
        Write-Host "Password: 123789"
        Write-Host "MEGA Account: jirawatkaewninta@gmail.com"
        Write-Host "=========================================="
        Write-Host "กำลังเชื่อมต่อ Serveo..."
        
        ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net
            }
            
            Send-Log "Starting serveo TCP Tunnel..."
            Start-Process -FilePath "serveo" -ArgumentList "tcp 3389"
            Start-Sleep -Seconds 10

            Send-Log "Setup completed successfully!"

            if ($infoWebhook) {
              $msg = "Windows RDP is ready!`nIP: $serveoIp`nUser: jira_zx`nPass: 123789"
              $bodyInfo = @{ content = $msg } | ConvertTo-Json
              Invoke-RestMethod -Uri $infoWebhook -Method Post -Body $bodyInfo -ContentType 'application/json'
            }

            serveo tcp 3389

        } catch {
            $errMsg = $_.Exception.Message
            Send-Log "ERROR occurred: $errMsg"
            throw $_
        }
